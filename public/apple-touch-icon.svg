<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003524" />
      <stop offset="100%" stop-color="#174D38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#9A7712" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Shield / Chit Emblem -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Main Center Icon (Architectural Bank / Chit Fund Symbol) -->
    <path d="M150 20 L280 85 L20 85 Z" fill="url(#goldGrad)" />
    
    <!-- Roof Beam -->
    <rect x="15" y="85" width="270" height="18" rx="4" fill="#FFFFFF" />
    
    <!-- Pillars -->
    <rect x="35" y="115" width="28" height="120" rx="6" fill="url(#goldGrad)" />
    <rect x="105" y="115" width="28" height="120" rx="6" fill="#FFFFFF" />
    <rect x="165" y="115" width="28" height="120" rx="6" fill="#FFFFFF" />
    <rect x="235" y="115" width="28" height="120" rx="6" fill="url(#goldGrad)" />
    
    <!-- Base -->
    <rect x="10" y="245" width="280" height="24" rx="6" fill="url(#goldGrad)" />
    <rect x="0" y="275" width="300" height="18" rx="4" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography / Sub-emblem -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="44" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">MSR CHITS</text>
</svg>